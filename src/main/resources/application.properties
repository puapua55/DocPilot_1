server.port=8080
spring.web.resources.static-locations=classpath:/static/

# Gemini API key must stay on the backend. Never expose it through Vite/frontend env variables.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# Do not allow RestClient DEBUG logging to print the document prompt body.
logging.level.org.springframework.web.client=INFO
