appId: com.docpilot.app
productName: DocPilot
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: ../target
    to: backend
    filter:
      - '*.jar'
      - '!original-*.jar'
  - from: runtime/jre
    to: jre
    filter:
      - '**/*'
win:
  target:
    - portable
