name: Chat Build

on:
  push:
    branches:
      - 'codex/docx-search-highlight-replace'
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/ai-document-chat.spec.js'
      - 'frontend/package*.json'
      - 'frontend/vite.config.js'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'docs/ai-document-chat-test-checklist.md'
      - 'pom.xml'
      - '.github/workflows/chat-build.yml'
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/ai-document-chat.spec.js'
      - 'frontend/package*.json'
      - 'frontend/vite.config.js'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'docs/ai-document-chat-test-checklist.md'
      - 'pom.xml'
      - '.github/workflows/chat-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for document chat E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run PDF and DOCX document chat E2E
        working-directory: frontend
        run: npm run test:e2e:chat-doc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test backend
        run: mvn -B test
